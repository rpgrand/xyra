<!DOCTYPE html>
<html>

<head>
    <title>Home</title>

    <style>

        body {
            background: rgba(124, 118, 121, 0.8);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 60px;
        }

        .profile {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .profile img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff6a00;
            cursor: pointer;

            transition: 0.3s ease;
        }

      
        .profile img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px #ff6a00;
        }

   	.profile img.zoom {
    transform: scale(3.5);
    border-radius: 10px;
    position: relative;
    z-index: 10;
	margin-top:200px;	
}
        h1 {
            color: #ff6a00;
        }

        p {
            color: #333;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="profile">

        <img src="download32.jpg"
             alt="Profile Picture"
             onclick="this.classList.toggle('zoom')">

        <h1>Welcome</h1>

        <p>Neil Tubaon</p>

        <p>Age: 22</p>

        <p>Address: Tabontabon Sibagat Agusan Del Sur</p>

    </div>

</body>

</html>
